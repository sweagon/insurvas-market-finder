[project]
name = "insurvas-market-finder"
version = "0.1.0"
description = "Senior Life Insurance Market Finder - public-data market prioritisation for the 60+ life insurance market"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Insurvas" }]
dependencies = [
    "duckdb==1.5.6",
    "polars==1.44.2",
    "httpx==0.28.1",
    "curl-cffi==0.16.3",
    "tenacity==9.1.4",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "pandera==0.34.1",
    "pdfplumber==0.11.10",
    "python-docx==1.2.0",
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "orjson==3.12.0",
    "apscheduler==3.11.3",
    "anyio==4.15.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "hypothesis==6.168.5",
    "ruff==0.16.10",
    "mypy==2.4.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "hypothesis==6.168.5",
    "ruff==0.16.10",
    "mypy==2.4.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "api"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["data/raw", "web", "node_modules", ".venv", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "N", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "docx.*", "duckdb.*", "yaml.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running tests (network / monte carlo)",
    "parity: python<->typescript golden parity",
]

[tool.coverage.run]
source = ["pipeline"]
