<!doctype html>
<html lang="en" data-theme="dark" data-density="comfortable" data-sidebar="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Insurvas Market Finder — where to sell life insurance to people 60+</title>
    <meta
      name="description"
      content="Rank every US county for senior life-insurance opportunity using public data. Pick a strategy lens and see the biggest 60+ pools first."
    />
    <link rel="preload" href="/fonts/geist-sans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/geist-mono.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/data/counties.json" as="fetch" crossorigin />
    <script>
      // Set the theme before first paint to avoid a flash (Part B.2).
      (function () {
        try {
          var t = localStorage.getItem("insurvas.theme");
          if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          document.documentElement.dataset.theme = t;
          var d = localStorage.getItem("insurvas.density");
          if (d) document.documentElement.dataset.density = d;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
